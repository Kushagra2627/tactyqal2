services:
  - type: web
    name: tactyqal-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard to your managed PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 32+ char key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: tactyqal_token
      - key: CORS_ORIGIN
        sync: false # Set this to your Vercel URL (e.g. https://tactyqal.vercel.app)
      - key: ADMIN_EMAIL
        value: admin@tactyqal.com
      - key: ADMIN_PASSWORD
        sync: false # Set your secure production admin password
      - key: ADMIN_NAME
        value: Tactyqal Admin
      - key: UPLOAD_DIR
        value: ./uploads
      - key: BASE_URL
        sync: false # Set to your Render service URL (e.g. https://tactyqal-backend.onrender.com)
