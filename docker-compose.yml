version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: tactyqal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tactyqal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tactyqal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tactyqal_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/tactyqal_db
      JWT_SECRET: super-secure-production-tactyqal-secret-key-32-chars-min
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: tactyqal_token
      CORS_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: admin@tactyqal.com
      ADMIN_PASSWORD: AdminPassword123!
      ADMIN_NAME: Tactyqal Admin
      UPLOAD_DIR: ./uploads
      BASE_URL: http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./tactyqal
      dockerfile: Dockerfile
    container_name: tactyqal_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api
      NEXT_PUBLIC_USE_MOCK: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
